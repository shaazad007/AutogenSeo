name: Auto Process Products

on:
  # Manual run from the app or Actions UI — preview/live a collection or refresh the read-only collection inventory.
  workflow_dispatch:
    inputs:
      mode:
        description: "preview, live, collections, enqueue, or queue-worker"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - live
          - collections
          - enqueue
          - queue-worker
      limit:
        description: "How many products to process in this run"
        required: true
        default: "10"
      collection_handle:
        description: "Optional Shopify collection handle to prioritize for this run"
        required: false
        default: ""
      logical_job_id:
        description: "App-generated ID that remains stable across a workflow rerun"
        required: false
        default: ""
      collection_handles:
        description: "JSON array of selected collection handles, kept in selection order"
        required: false
        default: "[]"
      enqueue_request_id:
        description: "Idempotency ID for one mobile enqueue request"
        required: false
        default: ""
      queue_mode:
        description: "Processing mode for the created collection jobs"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - preview

  # Automatic runs — live mode. Runs 4x/day (roughly every 6 hours) instead of
  # once, because at the current delay_seconds in config.json, one 6-hour
  # GitHub Actions job can only safely process ~150-170 products — running
  # more often adds up to a higher daily total without ever hitting GitHub's
  # hard 6-hour-per-job limit. Adjust times freely; these are UTC.
  schedule:
    - cron: "0 3 * * *"   # ~8am PKT/IST
    - cron: "0 9 * * *"   # ~2pm PKT/IST
    - cron: "0 15 * * *"  # ~8pm PKT/IST
    - cron: "0 21 * * *"  # ~2am PKT/IST

permissions:
  contents: write
  actions: write

concurrency:
  group: shopify-cloth-ai-run
  cancel-in-progress: false
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # stay safely under GitHub's hard 360-minute (6h) job limit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run processor (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 335
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional — leave the secret unset if you don't want the Groq fallback
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}  # optional third provider
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_COLLECTION_HANDLE: ${{ inputs.collection_handle }}
          INPUT_LOGICAL_JOB_ID: ${{ inputs.logical_job_id }}
          INPUT_COLLECTION_HANDLES: ${{ inputs.collection_handles }}
          INPUT_ENQUEUE_REQUEST_ID: ${{ inputs.enqueue_request_id }}
          INPUT_QUEUE_MODE: ${{ inputs.queue_mode }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node index.js --mode="$INPUT_MODE" --limit="$INPUT_LIMIT" --collection-handle="$INPUT_COLLECTION_HANDLE"

      # No need to hand-calculate a "safe" number anymore — index.js has its
      # own internal time budget (job_time_budget_minutes in config.json,
      # default 320 minutes) and stops itself cleanly well before GitHub's
      # 6-hour hard limit, resuming automatically on the next scheduled run.
      # It also stops cleanly (not as a pile of "failures") if every configured
      # image provider reaches its quota or rate limit. A high limit here means
      # "keep going
      # until the time budget or the daily_cap in config.json is reached".
      - name: Run processor (scheduled — live)
        if: github.event_name == 'schedule'
        timeout-minutes: 335
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node index.js --mode=scheduled --limit=100000

      # if: always() is essential — without it, this step is SKIPPED whenever
      # the run above fails, times out, or gets cancelled, and every product
      # that was already updated on Shopify during that run would silently
      # never get reflected in the dashboard/progress.json.
      - name: Commit progress, logs and (preview) output back to the repo
        if: always()
        run: |
          git config user.name "shopify-cloth-ai-bot"
          git config user.email "actions@github.com"
          git add docs/progress.json docs/failed.csv docs/last-run-log.json docs/history.json docs/queue_state.json preview/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update progress [skip ci]"
          fi
          # Serialize queue writers above and rebase any unrelated default-branch updates.
          # A queue-state conflict fails visibly; never overwrite a newer snapshot.
          branch="${GITHUB_REF_NAME}"
          if ! git pull --rebase origin "$branch"; then
            git rebase --abort
            echo "::error::Repository progress/queue conflict; newer queue state was preserved."
            exit 1
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then exit 0; fi
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort
              echo "::error::Queue state conflicted with a newer repository update; refusing to overwrite it."
              exit 1
            fi
          done
          echo "::error::Could not push queue state after three safe rebase attempts."
          exit 1
